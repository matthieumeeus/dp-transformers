$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: evaluate no-dp finetuned zephyr

settings:
  default_compute: azureml:ND96asrv4

inputs:
  model_id: "zephyr"

jobs:
  finetune:
    type: command
    component: ../../components/nodp_fine_tune_LLM/component_spec.yml
    inputs:
      nproc_per_node: 8
      model_name: "HuggingFaceH4/zephyr-7b-beta"
      train_data_path: "azureml:MATH-dataset-Train:1"
      sequence_len: 2048
      chat_model: True
      per_device_train_batch_size: 4
      gradient_accumulation_steps: 1
      evaluation_strategy: "no"
      save_strategy: "no"
      log_level: "info"
      seed: 42
      weight_decay: 0.1
      remove_unused_columns: False
      num_train_epochs: 3
      logging_steps: 10
      max_grad_norm: 0.0
      lr_scheduler_type: "constant"
      learning_rate: 2.5e-5
      dataloader_num_workers: 2
      lora_dim: 4
      lora_alpha: 32
      lora_dropout: 0.0
      target_modules: "\"['q_proj', 'v_proj']\""
  evaluation:
    type: pipeline
    component: ../../components/evaluation/evaluate_llm.yml
    inputs:
      model: ${{parent.jobs.finetune.outputs.output_dir}}
      model_id: ${{parent.inputs.model_id}}
