$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: SST2
experiment_name: auditing-synthetic-text-generation

settings:
  default_compute: azureml:ND96asrv4

inputs:
  model_path:
    type: uri_folder
    path: "azureml:Mistral-7B-v0point1:1"

jobs:
  preprocess:
    type: command
    component: ./components/preprocess_for_synthesizer/component_spec.yml
    inputs:
      dataset: "azureml:SST2-train:3"
      templated_prompt: "A sentence with a {label} sentiment: "
      label_column: "label"
      text_column: "sentence"
    outputs:
      train_data:
        mode: "rw_mount"
  fine_tune:
    type: command
    component: azureml:dp_fine_tune_llm_w_qlora:5
    inputs:
      train_data_path: ${{parent.jobs.preprocess.outputs.train_data}}
      model_path: ${{parent.inputs.model_path}}
      nproc_per_node: 8
      sequence_len: 1024
      per_device_train_batch_size: 16
      gradient_accumulation_steps: 1
      seed: 239023
      chat_format: False
      target_epsilon: 8
      target_delta: 1e-3
      per_sample_max_grad_norm: 1.0
      num_train_epochs: 5.0
      learning_rate: 3e-4
    outputs:
      output_dir:
        mode: "rw_mount"
  generate:
    type: command
    component: azureml:llm_synthetic_data_generation:2
    inputs:
      lora_path: ${{parent.jobs.fine_tune.outputs.output_dir}}
      model_path: ${{parent.inputs.model_path}}
      train_data_path: ${{parent.jobs.preprocess.outputs.train_data}}
      nproc_per_node: 8
      batch_size: 32
      seed: 2933
      max_new_tokens: 128
