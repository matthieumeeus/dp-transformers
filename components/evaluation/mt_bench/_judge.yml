$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command

name: dp-transformers-evaluation-mt-bench-judge
display_name: MT-Bench-Judge

description: "Call GPT-4 to judge answers for MT-Bench answers."

inputs:
  num_concurrent_api_calls:
    type: integer
    description: "Number of concurrent API calls to use."
  model_id:
    type: string
    description: "ID of the model to use. This will be used by FastChat to load the appropriate conversation template. For details see: https://github.com/lm-sys/FastChat/blob/main/docs/model_support.md#how-to-support-a-new-model"
  openai_api_base:
    type: string
    description: "Base URL for the OpenAI API."
    optional: true
  openai_api_key_secret_name:
    type: string
    description: "Name of the secret containing the OpenAI API key in the Azure key vault."
    optional: true
  openai_api_type:
    type: string
    description: "Type of the OpenAI API to use."
    optional: true
  openai_api_version:
    type: string
    description: "Version of the OpenAI API to use."
    optional: true
  answers:
    type: uri_file
    description: "Path to the answers file."
outputs:
  judgments:
    type: uri_file
    description: "Path to the judgments file."
  results:
    type: uri_file
    description: "Path to the results file."

code: ./

command: >-
  python judge.py \
    --results ${{outputs.results}} \
    --judgments ${{outputs.judgments}} \
    --results ${{outputs.results}} \
    --answers ${{inputs.answers}} \
    --model_id ${{inputs.model_id}} \
    $[[ --openai_api_base ${{inputs.openai_api_base}} ]] \
    $[[ --openai_api_key_secret_name ${{inputs.openai_api_key_secret_name}} ]] \
    $[[ --openai_api_type ${{inputs.openai_api_type}} ]] \
    $[[ --openai_api_version ${{inputs.openai_api_version}} ]] \
    --num_concurrent_api_calls ${{inputs.num_concurrent_api_calls}}


environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04
  conda_file: ./environment.yml
