$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command

name: dp-transformers-evaluate
display_name: MT-Bench

description: "Evaluate a language model on a dataset."

inputs:
  model:
    type: uri_folder
    description: "Path to the model to use in HF format."
  num_gpus_per_model:
    type: integer
    description: "Number of GPUs to use per model."
    default: 1
  num_concurrent_api_calls:
    type: integer
    description: "Number of concurrent API calls to use."
  num_total_gpus:
    type: integer
    description: "Total number of GPUs to use. Default is to use all available GPUs."
    optional: true
outputs:
  results:
    type: uri_file
    description: "Path to the results file."
  judgements:
    type: uri_file
    description: "Path to the judgements file."
  answers:
    type: uri_file
    description: "Path to the answers file."

code: ./

command: >-
  python evaluate.py \
    --model ${{inputs.model}} \
    --results ${{outputs.results}} \
    --judgements ${{outputs.judgements}} \
    --answers ${{outputs.answers}} \
    --num_gpus_per_model ${{inputs.num_gpus_per_model}} \
    $[[ --num_total_gpus ${{inputs.num_total_gpus}} ]] \
    --num_concurrent_api_calls ${{inputs.num_concurrent_api_calls}}


environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04
  conda_file: ./environment.yml
