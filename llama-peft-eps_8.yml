$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: parameter_efficient_fine_tuning-epsilon_8

settings:
  default_compute: azureml:ND40rsv2-2

jobs:
  train_model:
    type: command
    component: ./components/differentially_private_fine_tuning/component_spec.yml
    inputs:
      nproc_per_node: 8
      model_path: "azureml:llama-2-7b-chat-hf:2"
      train_data_path: "azureml:IMDB-train-jsonl:1"
      val_data_path: "azureml:IMDB-train-jsonl:1"
      text_column: text
      sequence_len: 2048
      per_device_train_batch_size: 128
      gradient_accumulation_steps: 1
      seed: 42
      target_epsilon: 8
      target_delta: 2e-6
      per_sample_max_grad_norm: 1.0
      weight_decay: 0.01
      num_train_epochs: 3
      learning_rate: 1e-4
